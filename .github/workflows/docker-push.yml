# ============================================================
# 股票看板 · 自动构建并推送 Docker 镜像到 Docker Hub
#
# 触发时机：
#   - push 到 main 分支        -> 推送 main + latest 两个 tag
#   - 打 tag（v1.2.3 格式）    -> 推送 1.2.3 / 1.2 / 1 / v1.2.3 等版本 tag
#   - 手动触发（Actions 页面 Run workflow）可勾选是否带 AkShare
#
# 首次使用前需要在仓库 Settings -> Secrets and variables -> Actions 配置：
#   DOCKERHUB_USERNAME  你的 Docker Hub 用户名（如 alice）
#   DOCKERHUB_TOKEN     访问令牌（Docker Hub -> Account Settings -> Security
#                       -> New Access Token，权限勾选 Read, Write, Delete）
# 推送成功后镜像名为：<用户名>/stock-board:<tag>
# ============================================================

name: 构建并推送 Docker 镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      with_akshare:
        description: "构建含 AkShare 的镜像（约 +400MB）"
        type: boolean
        default: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/stock-board

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离线冒烟测试（不依赖网络/浏览器）
        run: python backend/smoke_test.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4.4.0

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: 登录 Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 手动触发时可勾选；push/tag 触发默认 true，与 docker-compose.yml 保持一致
          build-args: |
            WITH_AKSHARE=${{ inputs.with_akshare || 'true' }}
          # 利用 GitHub Actions 缓存，重复构建不重新下载依赖
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像摘要
        run: |
          echo "已推送：${{ env.IMAGE_NAME }}"
          echo "标签：${{ steps.meta.outputs.tags }}"
