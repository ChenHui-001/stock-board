# ============================================================
# 股票看板 · 生产部署 Compose（从 Docker Hub 拉取镜像，不构建）
#
# 用法：
#   首次/升级部署（默认 latest）：
#     docker compose -f docker-compose.prod.yml up -d
#   指定版本部署：
#     IMAGE=nanpo/stock-board:v1.2.3 docker compose -f docker-compose.prod.yml up -d
#   手动拉取新镜像：
#     docker compose -f docker-compose.prod.yml pull
#   查看状态 / 日志 / 停止：
#     docker compose -f docker-compose.prod.yml ps
#     docker compose -f docker-compose.prod.yml logs -f
#     docker compose -f docker-compose.prod.yml down
#
# 说明：
#   - 与 docker-compose.yml（本地构建版）唯一区别：无 build 段，镜像从 Docker Hub 拉取。
#   - 服务器上无需任何源码，只要这一个文件 + Docker。
#   - 数据存命名卷 stock-board-data，容器重建/升级不丢。
#   - 全部配置用环境变量覆盖，无 .env 文件、无 healthcheck。
# ============================================================

name: stock-board

services:
  stock-board:
    # 从 Docker Hub 拉取：默认 nanpo/stock-board:latest，可用 IMAGE 覆盖任意 tag
    image: "${IMAGE:-nanpo/stock-board:latest}"
    container_name: stock-board
    restart: unless-stopped           # 崩溃/重启后自动拉起

    # 宿主机 HOST_PORT -> 容器 8000（应用固定监听 8000）
    ports:
      - "${HOST_PORT:-8000}:8000"

    environment:
      # ---------- 基础 ----------
      TZ: Asia/Shanghai               # 交易时段判断依赖东八区
      DATA_DIR: /app/data

      # ---------- AI 分析（OpenAI 兼容协议） ----------
      # 不配 LLM_API_KEY 也能跑：AI 分析自动降级为内置规则引擎
      LLM_ENABLED: "${LLM_ENABLED:-true}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_JSON_MODE: "${LLM_JSON_MODE:-true}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-45}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-4000}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.25}"

      # ---------- 数据源 ----------
      PROVIDER_ORDER: "${PROVIDER_ORDER:-eastmoney,tencent,sina,ths,akshare}"
      ENABLE_AKSHARE: "${ENABLE_AKSHARE:-true}"
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-6}"
      HTTP_RETRY: "${HTTP_RETRY:-2}"

      # ---------- 缓存 TTL（秒） ----------
      QUOTE_TTL_OPEN: "${QUOTE_TTL_OPEN:-2.5}"
      QUOTE_TTL_CLOSED: "${QUOTE_TTL_CLOSED:-60}"
      HISTORY_TTL_OPEN: "${HISTORY_TTL_OPEN:-120}"
      HISTORY_TTL_CLOSED: "${HISTORY_TTL_CLOSED:-900}"
      SEARCH_TTL: "${SEARCH_TTL:-300}"
      HOT_TTL: "${HOT_TTL:-60}"

      # ---------- 业务参数 ----------
      KLINE_LIMIT: "${KLINE_LIMIT:-260}"
      FLOW_DAYS: "${FLOW_DAYS:-30}"
      MARGIN_DAYS: "${MARGIN_DAYS:-30}"

    # 数据持久化：容器重建不丢
    volumes:
      - stock-board-data:/app/data

    # 日志上限：防止长期运行占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 资源上限（按需调整）
    mem_limit: 1g
    cpus: "1.0"

volumes:
  stock-board-data:
