<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股票看板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">股</span>
        <span class="brand-name">股票看板</span>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/home" data-route="home">首页</a>
        <a class="nav-item" href="#/search" data-route="search">查询</a>
        <a class="nav-item" href="#/hotspot" data-route="hotspot">🔥 热点追踪</a>
      </nav>

      <div class="topbar-right">
        <span class="session" id="session-badge" title="交易时段">--</span>
        <div class="ds-wrap">
          <button class="ds-badge" id="btn-ds" title="数据源状态" aria-label="数据源状态" aria-expanded="false">
            <span class="ds-dot" id="ds-dot"></span>
            <span id="ds-label">数据源</span>
          </button>
          <div class="ds-popover" id="ds-popover" hidden></div>
        </div>
        <button class="btn btn-ghost" id="btn-settings" title="AI 模型配置" aria-label="设置">⚙</button>
        <button class="btn btn-ghost" id="btn-manage" title="批量管理自选股">管理</button>
        <button class="btn btn-primary" id="btn-refresh" title="手动刷新全部数据">
          <span class="refresh-icon">⟳</span> 刷新
        </button>
      </div>
    </div>
    <div class="topbar-sub" id="topbar-sub"></div>
  </header>

  <main id="view"></main>

  <footer class="app-footer">
    <div class="footer-line">股票看板 · 行情数据来自东方财富 / 同花顺 / 腾讯 / 新浪等公开接口，可能存在延迟或缺失</div>
    <div class="footer-line">本工具仅用于数据研究与学习，所有内容不构成任何投资建议 · 市场有风险，决策请自行判断</div>
  </footer>

  <div class="modal-root" id="modal-root" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">AI 智能分析</div>
        <div class="modal-actions" id="modal-actions"></div>
        <button class="modal-close" data-close="1" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="modal-root" id="modal-settings" hidden>
    <div class="modal-mask" data-close-settings="1"></div>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <div class="modal-title" id="settings-title">AI 模型配置</div>
        <button class="modal-close" data-close-settings="1" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="cfg-hint">支持配置多套模型：主模型优先调用，超时/报错自动切换下一个可用模型，全部失败才降级内置规则引擎。API Key 界面不回显，留空保存即保持不变。</div>
        <div class="cfg-profiles" id="cfg-profiles"></div>
        <div class="cfg-actions">
          <button class="btn btn-sm" id="cfg-add">＋ 添加模型</button>
          <span class="cfg-note" id="cfg-note" style="margin:0"></span>
        </div>
        <div class="cfg-actions">
          <button class="btn btn-primary" id="cfg-save">保存</button>
          <button class="btn btn-ghost" id="cfg-reset">恢复默认（环境变量）</button>
        </div>

        <div class="cfg-divider">AI 评分权重</div>
        <div class="cfg-hint">三维分面评分乘数（0.2~3.0，默认 1.0）：调大某面让该维度信号更强。保存后 AI 当日缓存自动失效。</div>
        <div class="cfg-row cfg-weights">
          <div class="cfg-weight">
            <label for="w-tech">技术面</label>
            <input id="w-tech" type="number" min="0.2" max="3" step="0.1" value="1.0">
          </div>
          <div class="cfg-weight">
            <label for="w-capital">资金面</label>
            <input id="w-capital" type="number" min="0.2" max="3" step="0.1" value="1.0">
          </div>
          <div class="cfg-weight">
            <label for="w-news">消息面</label>
            <input id="w-news" type="number" min="0.2" max="3" step="0.1" value="1.0">
          </div>
        </div>
        <div class="cfg-actions">
          <button class="btn btn-sm btn-primary" id="w-save">保存权重</button>
          <button class="btn btn-sm btn-ghost" id="w-reset">恢复默认</button>
          <span class="cfg-test-result" id="w-result"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-root" id="toast-root"></div>

  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/js/util.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/page-home.js"></script>
  <script src="/static/js/page-search.js"></script>
  <script src="/static/js/page-hotspot.js"></script>
  <script src="/static/js/page-value.js"></script>
  <script src="/static/js/page-detail.js"></script>
  <script src="/static/js/ai.js"></script>
  <script src="/static/js/news.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
