[pytest]
# 异步用例（async def test_xxx）交给 pytest-asyncio 自动接管，不必逐条手写
# @pytest.mark.asyncio。
#
# 背景：此前这里没有 pytest 配置文件，靠 tests/conftest.py 里的
# pytest_collection_modifyitems 钩子补标记，但判据写成了 `co_flags & 0x100`
# （CO_ITERABLE_COROUTINE），而 CO_COROUTINE 是 0x80、async def 的 co_flags
# 是 0x83，判据恒为假 → 钩子从未生效。后果是异步用例被 pytest 以
# 「no async plugin installed」静默跳过：不报错、不执行，只是数量莫名变少。
# 用官方 auto 模式替代，异步用例再也不会因为漏写标记而假装通过。
asyncio_mode = auto

# 消除 pytest-asyncio 关于 fixture loop scope 未设置的弃用告警
asyncio_default_fixture_loop_scope = function

# 裸跑 pytest 时默认只收集 tests/，避免扫到 node_modules / tmp 等目录
testpaths = tests
